name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check JS files
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -r -n1 node --check
